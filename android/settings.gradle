pluginManagement {
    def localProperties = new Properties()
    def localPropertiesFile = new File(rootDir, "local.properties")
    if (localPropertiesFile.exists()) {
        localPropertiesFile.withInputStream { localProperties.load(it) }
    }
    // `flutter build`/`flutter run` regenerate android/local.properties, so this file
    // is intentionally not committed to Git. FLUTTER_ROOT is used as a fallback.
    def flutterSdkPath = localProperties.getProperty("flutter.sdk") ?: System.getenv("FLUTTER_ROOT")
    if (flutterSdkPath == null) {
        throw new GradleException(
            "Flutter SDK not found. Set flutter.sdk in android/local.properties or export FLUTTER_ROOT."
        )
    }

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "9.1.0" apply false
    id "org.jetbrains.kotlin.android" version "2.4.0" apply false
}

include ":app"
